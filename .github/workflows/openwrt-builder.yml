#
# XR30 固件构建流水线
# 基线：chasey-dev/immortalwrt-mt798x-rebase @ 25.12
# 设备：cmcc_xr30-nand-mtkuboot（NAND + MTK/H大 U-Boot 固定分区）
#
# 与原模板的差别：
#   1. 手工触发之外，push 到 main 也会构建（改脚本后不用再点一次）
#   2. 加了 2G swap，防止 ruby/golang 并发编译时 OOM
#   3. defconfig 之后跑 verify-config.sh 硬校验，缺功能就早失败
#   4. 编译前先 prepare 一次 mt_wifi，验证 PMF 补丁能干净应用
#   5. 清理类步骤改为不阻断（缺 PAT 时不影响拿产物）
#
name: Build XR30 Firmware

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'

env:
  REPO_URL: https://github.com/chasey-dev/immortalwrt-mt798x-rebase
  REPO_BRANCH: 25.12
  DEVICE: cmcc_xr30-nand-mtkuboot
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装编译依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
            git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev \
            libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev \
            libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 \
            python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
          sudo bash -c 'bash <(curl -s https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name: 增加 swap（防 OOM）
        run: |
          sudo fallocate -l 2G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=2048
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: 拉取源码
        working-directory: /workdir
        run: |
          df -hT $PWD
          git clone $REPO_URL -b $REPO_BRANCH openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: 声明第三方 feed
        run: |
          cd openwrt
          chmod +x "$GITHUB_WORKSPACE/$DIY_P1_SH"
          bash "$GITHUB_WORKSPACE/$DIY_P1_SH"
          grep -E '^src-git' feeds.conf.default

      - name: 更新 feeds
        run: cd openwrt && ./scripts/feeds update -a

      - name: 安装 feeds
        run: cd openwrt && ./scripts/feeds install -a

      - name: 植入补丁并写入配置
        run: |
          chmod +x "$GITHUB_WORKSPACE/$DIY_P2_SH"
          cp "$GITHUB_WORKSPACE/$CONFIG_FILE" openwrt/.config
          cd openwrt
          bash "$GITHUB_WORKSPACE/$DIY_P2_SH"

      - name: defconfig
        run: cd openwrt && make defconfig

      - name: 硬校验配置
        run: |
          chmod +x "$GITHUB_WORKSPACE/verify-config.sh"
          cd openwrt
          bash "$GITHUB_WORKSPACE/verify-config.sh"

      - name: 下载依赖包
        run: |
          cd openwrt
          make download -j8 || make download -j1 V=s
          find dl -size -1024c -exec ls -l {} \; || true
          find dl -size -1024c -exec rm -f {} \; || true

      # 必须在 download 之后：这样失败就只可能是补丁本身的问题，
      # 不会和"源码没下下来"混在一起。pipefail 是必须的，否则
      # `make | tail` 的退出码是 tail 的 0，补丁打失败也会显示通过。
      - name: 预检驱动补丁能否应用
        run: |
          set -o pipefail
          cd openwrt
          make package/mtk/drivers/mt_wifi/prepare V=s 2>&1 | tail -40

      - name: 编译
        id: compile
        run: |
          cd openwrt
          echo "$(nproc) 线程编译"
          make -j$(nproc) || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT
          ls -lh bin/targets/mediatek/filogic/ || true
          echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

      - name: 空间占用
        if: (!cancelled())
        run: df -hT

      - name: 整理产物
        id: organize
        if: steps.compile.outputs.status == 'success' && !cancelled()
        run: |
          cd openwrt/bin/targets/*/*
          mkdir -p firmware
          # 只收本设备的镜像，避免把同 SoC 其它机型混进来
          cp *"${DEVICE}"* firmware/ 2>/dev/null || cp * firmware/ 2>/dev/null || true
          cp sha256sums firmware/ 2>/dev/null || true
          [ -f profiles.json ] && cp profiles.json firmware/ || true
          ls -lh firmware
          echo "FIRMWARE=$PWD/firmware" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        if: steps.organize.outputs.status == 'success' && !cancelled()
        with:
          name: XR30_firmware${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE }}

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        if: steps.organize.outputs.status == 'success' && !cancelled()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: build-${{ github.run_number }}-${{ github.run_id }}
          name: XR30 ${{ env.DEVICE }} build ${{ github.run_number }}
          body: |
            自动构建产物
            - 基线：${{ env.REPO_URL }} @ ${{ env.REPO_BRANCH }}
            - 设备：${{ env.DEVICE }}（NAND + MTK/H大 U-Boot 固定分区）
            - 含 mtwifi PMF 补丁（042 / 043）
          files: ${{ env.FIRMWARE }}/*

      - name: 清理旧 Release（需要 PAT，缺省不阻断）
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          github-token: ${{ secrets.ACTIONS_TRIGGER_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const keepLatest = 3;
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            releases.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            for (const rel of releases.slice(keepLatest)) {
              core.info(`删除 release ${rel.tag_name}`);
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: rel.id
              });
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `tags/${rel.tag_name}`
                });
              } catch (err) {
                core.info(`tag 未删除: ${err.message}`);
              }
            }
