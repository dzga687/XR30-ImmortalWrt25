#
# XR30 固件构建流水线
# 基线：chasey-dev/immortalwrt-mt798x-rebase @ 25.12
# 设备：cmcc_xr30-nand-mtkuboot（NAND + MTK/H大 U-Boot 固定分区）
#
# 与原模板的差别：
#   1. 手工触发之外，push 到 main 也会构建（改脚本后不用再点一次）
#   2. 加了 2G swap，防止 ruby/golang 并发编译时 OOM
#   3. defconfig 之后跑 verify-config.sh 硬校验，缺功能就早失败
#   4. 编译前先 prepare 一次 mt_wifi，验证 PMF 补丁能干净应用
#   5. 清理类步骤改为不阻断（缺 PAT 时不影响拿产物）
#
name: Build XR30 Firmware

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'

# 同一分支只允许一个构建在跑：新触发会自动取消旧的，
# 避免 push 与 workflow_dispatch 同时生效时出现两个 run 并行编译。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REPO_URL: https://github.com/chasey-dev/immortalwrt-mt798x-rebase
  REPO_BRANCH: 25.12
  DEVICE: cmcc_xr30-nand-mtkuboot
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 这一步原来会无上限地挂住：apt 没有重试上限，末尾那句
      # `bash <(curl -s https://build-scripts.immortalwrt.org/...)` 里的 curl
      # 也没设 --max-time，对方一旦不回包就会永久等待。实测卡了 41 分钟
      # 没有任何输出。现在：拆成带标记的子步骤、apt 加超时与重试、
      # 去掉不可控的远端脚本，并给整步设 30 分钟硬上限。
      - name: 安装编译依赖
        timeout-minutes: 30
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -x
          echo "==> [1/6] 清理 runner 上占空间的大目录"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true

          # runner 起机时常有 unattended-upgrades 在后台跑，会长时间占住
          # dpkg 锁，apt 就会静默停在 "Waiting for cache lock" 不动。
          echo "==> [2/6] 停掉会抢 dpkg 锁的后台任务"
          sudo systemctl stop unattended-upgrades 2>/dev/null || true
          sudo systemctl disable unattended-upgrades 2>/dev/null || true
          sudo systemctl stop apt-daily.timer apt-daily-upgrade.timer 2>/dev/null || true
          sudo pkill -f unattended-upgrade 2>/dev/null || true
          sleep 2
          echo "残留 apt/dpkg 进程:"
          pgrep -a 'apt|dpkg|unattended' || echo "  (无)"

          echo "==> [3/6] 刷新软件源（3 次重试，单次 60s 超时，锁最多等 120s）"
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 \
                       -o DPkg::Lock::Timeout=120 update

          echo "==> [4/6] 安装编译依赖"
          timeout 1500 sudo -E apt-get -qq install -y --no-install-recommends \
            -o DPkg::Lock::Timeout=120 \
            ack antlr3 asciidoc autoconf automake autopoint bc binutils bison build-essential \
            bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
            git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev \
            libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev \
            libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python3 \
            python3-docutils python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo \
            time uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev \
            || { echo "!! 依赖安装失败，已装包数:"; dpkg -l | grep -c '^ii' ; exit 1; }

          echo "==> [5/6] 清理"
          sudo -E apt-get -qq -o DPkg::Lock::Timeout=120 autoremove --purge || true
          sudo -E apt-get -qq clean || true
          sudo timedatectl set-timezone "$TZ"

          echo "==> [6/6] 准备构建目录"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir
          echo "==> 依赖完成：$(gcc --version | head -1) / $(python3 --version)"

      # GitHub 的 ubuntu-22.04 runner 自带 /swapfile（且正在使用），
      # 直接 fallocate 覆盖会报 "Text file busy"。所以先检测，没有才建，
      # 并且用不同路径，避免踩到已有的活动 swap 文件。
      - name: 确保有 swap（runner 自带则跳过）
        run: |
          if swapon --show | grep -q .; then
            echo "runner 已启用 swap，跳过创建"
          else
            echo "未检测到 swap，创建 2G"
            sudo fallocate -l 2G /swapfile_ci || sudo dd if=/dev/zero of=/swapfile_ci bs=1M count=2048
            sudo chmod 600 /swapfile_ci
            sudo mkswap /swapfile_ci
            sudo swapon /swapfile_ci
          fi
          free -h
          swapon --show || true

      - name: 拉取源码
        timeout-minutes: 25
        working-directory: /workdir
        run: |
          df -hT $PWD
          git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: 声明第三方 feed
        run: |
          cd openwrt
          chmod +x "$GITHUB_WORKSPACE/$DIY_P1_SH"
          bash "$GITHUB_WORKSPACE/$DIY_P1_SH"
          grep -E '^src-git' feeds.conf.default

      - name: 更新 feeds
        timeout-minutes: 20
        run: cd openwrt && ./scripts/feeds update -a

      - name: 安装 feeds
        timeout-minutes: 15
        run: cd openwrt && ./scripts/feeds install -a

      - name: 植入补丁并写入配置
        run: |
          chmod +x "$GITHUB_WORKSPACE/$DIY_P2_SH"
          cp "$GITHUB_WORKSPACE/$CONFIG_FILE" openwrt/.config
          cd openwrt
          bash "$GITHUB_WORKSPACE/$DIY_P2_SH"

      - name: defconfig
        run: cd openwrt && make defconfig

      - name: 硬校验配置
        run: |
          chmod +x "$GITHUB_WORKSPACE/verify-config.sh"
          cd openwrt
          bash "$GITHUB_WORKSPACE/verify-config.sh"

      - name: 诊断缺失的配置项
        if: failure()
        run: |
          cd openwrt
          echo "===== 1) .config 中相关符号的取值 ====="
          for s in luci-app-store luci-lib-taskd luci-lib-xterm taskd script-utils coreutils-stty mount-utils libuci-lua curl tar; do
            if grep -q "^CONFIG_PACKAGE_${s}=y" .config; then
              echo "  [y] $s"
            elif grep -q "^# CONFIG_PACKAGE_${s} is not set" .config; then
              echo "  [n] $s"
            else
              echo "  [?] $s   <- 符号不出现在 .config，说明被 kconfig 隐藏（depends 不成立）"
            fi
          done

          echo "===== 2) tmp 下的元数据文件 ====="
          ls -la tmp/ 2>/dev/null | head -15 || echo "  (没有 tmp 目录)"

          echo "===== 3) .config-package.in 里 luci-app-store 的定义 ====="
          if [ -f tmp/.config-package.in ]; then
            echo "  行数: $(wc -l < tmp/.config-package.in)"
            grep -A10 "^config PACKAGE_luci-app-store$" tmp/.config-package.in || echo "  (没有 config PACKAGE_luci-app-store 定义)"
          else
            echo "  tmp/.config-package.in 不存在，重新生成元数据后再看"
            make prepare-tmpinfo V=s 2>&1 | tail -40 || true
            if [ -f tmp/.config-package.in ]; then
              echo "  重新生成后行数: $(wc -l < tmp/.config-package.in)"
              grep -A10 "^config PACKAGE_luci-app-store$" tmp/.config-package.in || echo "  重新生成后仍无该符号"
            else
              echo "  prepare-tmpinfo 之后依然没有 tmp/.config-package.in"
            fi
          fi

          echo "===== 4) istore 包在树里的实际内容 ====="
          ls -l package/feeds/istore/ 2>/dev/null | head -10 || echo "  不存在"
          echo "--- luci-app-store 的 Makefile 关键行 ---"
          grep -nE '^LUCI_(DEPENDS|EXTRA_DEPENDS|PKGARCH)' package/feeds/istore/luci-app-store/Makefile 2>/dev/null || echo "  (读不到)"

      - name: 下载依赖包
        timeout-minutes: 60
        run: |
          cd openwrt
          make download -j8 || make download -j1 V=s
          find dl -size -1024c -exec ls -l {} \; || true
          find dl -size -1024c -exec rm -f {} \; || true

      # 必须在 download 之后：这样失败就只可能是补丁本身的问题，
      # 不会和"源码没下下来"混在一起。pipefail 是必须的，否则
      # `make | tail` 的退出码是 tail 的 0，补丁打失败也会显示通过。
      - name: 预检驱动补丁能否应用
        run: |
          set -o pipefail
          cd openwrt
          make package/mtk/drivers/mt_wifi/prepare V=s 2>&1 | tail -40

      # 每次失败都要重跑近 90 分钟的编译，太贵。打开 CONFIG_CCACHE 后
      # 把 ~/.ccache 存成 cache：重跑时只重编改动过的部分。
      - name: 恢复 ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-

      - name: 编译
        id: compile
        timeout-minutes: 240
        run: |
          set -o pipefail
          cd openwrt
          echo "$(nproc) 线程编译"
          # 原来写的是 `make -j || make -j1 V=s`：并行编到 105 分钟失败后，
          # 又会用 -j1 从头再跑一遍，等于把失败现场的定位成本翻倍。
          # 改成单遍编译 + 失败后直接从日志里摘出错误上下文。
          if ! make -j$(nproc) 2>&1 | tee compile.log; then
            echo
            echo "==================== 编译失败摘要 ===================="
            echo "--- 失败的包（ERROR: package/... failed）---"
            grep -nE 'ERROR: package/.+ failed' compile.log | tail -20 || echo "  (无)"
            echo "--- make 报错行 ---"
            grep -nE '\*\*\* \[|: Error [0-9]+' compile.log | tail -20 || echo "  (无)"
            echo
            echo "--- 第一处错误的上下文 ---"
            first=$(grep -nE 'ERROR: package/.+ failed' compile.log | head -1 | cut -d: -f1)
            if [ -n "$first" ]; then
              start=$((first > 40 ? first - 40 : 1))
              sed -n "${start},$((first + 5))p" compile.log
            fi
            echo "======================================================"
            exit 1
          fi
          echo "status=success" >> $GITHUB_OUTPUT
          ls -lh bin/targets/mediatek/filogic/ || true
          echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

      # -j 并行时 OpenWrt 不会把子 make 的编译输出刷到主日志里，只留一句
      # "ERROR: package/xxx failed to build"，看不到真实报错。失败后单独
      # 把那个包用 V=s 重编一遍（源码已解压、依赖已就绪，通常几十秒），
      # 真正的 gcc 报错就打出来了。
      - name: 诊断编译失败（抓真实报错）
        if: failure()
        continue-on-error: true
        timeout-minutes: 15
        run: |
          cd openwrt
          if [ ! -f compile.log ]; then
            echo "没有 compile.log（编译步骤没跑到）"
            exit 0
          fi
          pkg=$(grep -oE 'ERROR: package/[^ ]+ failed' compile.log | head -1 | sed 's/^ERROR: //; s/ failed$//')
          echo "失败包: ${pkg:-（未解析到）}"
          [ -n "$pkg" ] || exit 0
          echo "===== make $pkg/compile V=s 输出（尾部 160 行）====="
          make "$pkg/compile" V=s -j1 2>&1 | tail -160 || true

      - name: 空间占用
        if: (!cancelled())
        run: df -hT

      - name: 整理产物
        id: organize
        if: steps.compile.outputs.status == 'success' && !cancelled()
        run: |
          cd openwrt/bin/targets/*/*
          mkdir -p firmware
          # 只收本设备的镜像，避免把同 SoC 其它机型混进来
          cp *"${DEVICE}"* firmware/ 2>/dev/null || cp * firmware/ 2>/dev/null || true
          cp sha256sums firmware/ 2>/dev/null || true
          [ -f profiles.json ] && cp profiles.json firmware/ || true
          ls -lh firmware
          echo "FIRMWARE=$PWD/firmware" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        if: steps.organize.outputs.status == 'success' && !cancelled()
        with:
          name: XR30_firmware${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE }}

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        if: steps.organize.outputs.status == 'success' && !cancelled()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: build-${{ github.run_number }}-${{ github.run_id }}
          name: XR30 ${{ env.DEVICE }} build ${{ github.run_number }}
          body: |
            自动构建产物
            - 基线：${{ env.REPO_URL }} @ ${{ env.REPO_BRANCH }}
            - 设备：${{ env.DEVICE }}（NAND + MTK/H大 U-Boot 固定分区）
            - 含 mtwifi PMF 补丁（042 / 043）
          files: ${{ env.FIRMWARE }}/*

      - name: 清理旧 Release（需要 PAT，缺省不阻断）
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          github-token: ${{ secrets.ACTIONS_TRIGGER_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const keepLatest = 3;
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            releases.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            for (const rel of releases.slice(keepLatest)) {
              core.info(`删除 release ${rel.tag_name}`);
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: rel.id
              });
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `tags/${rel.tag_name}`
                });
              } catch (err) {
                core.info(`tag 未删除: ${err.message}`);
              }
            }
